# three-tier/template.yaml

AWSTemplateFormatVersion: "2010-09-09"
Description: Three-tier architecture - network, security groups, web tier, application tier and database tier

# Parameters
# Values can change between deployments so parameters are used instead of hard-coded values.
# Each resource has default parameter so there was no need to pass any overriding parameters.

Parameters:
  # Address range of entire VPC.  Each subnet will be calculated from this value.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR (Classless Inter-Domain Routing) range of the VPC (Virtual Private Cloud)

# Smaller instance to lower costs.  Larger classes required for real workload.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS (Relational Database Service) instance class

  DbName:
    Type: String
    Default: appdb
    Description: Name of the initial database created inside the PostgreSQL instance

  DbUsername:
    Type: String
    # Password is not a parameter.  Generated by RDS.
    Default: appadmin
    Description: Master username of the database

  #  Must be an x86_64 type to match the AMI below.
  AppInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 (Elastic Compute Cloud) instance type for the application tier

  AppAmiId:
    # Gets AMI ID when the stack deploys
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI (Amazon Machine Image), resolved from SSM (Systems Manager) Parameter Store

Resources:

  # Network

  # Private network housing all the tiers.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      # EnableDnsSupport turns on the VPC's DNS (Domain Name System) server.
      EnableDnsSupport: true
      #EnableDnsHostnames gives instances with public IPs a DNS name.
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  # VPC's connection to the internet
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Two subnets per tier, one per AZ (Availability Zone), so one AZ failing would not stop a tier.

  # Web tier subnets (hold the load balancer and NAT gateway)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      # First AZ in the region, so no AZ name is hard-coded
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"

  # Application tier subnets (private, no public IPs)
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-a"

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-b"

  # Database tier subnets (No internet access)
  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-a"

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 6, 8]]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-b"

  # Fixed IP Address for the NAT gateway
  NatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  # NAT gateway lets application tier send outbound requests without being reachable from the internet
  # Only one was used to reduce cost, so it could be a single point of failure.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  # Route tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  # Sends traffic leaving the VPC to the internet gateway
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-rt"

  # Sends traffic leaving VPC through the NAT gateway (outbound only)
  AppDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # database subnets have no default route. No access to the internet
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-rt"

  # Each subnet uses associated route table
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref AppRouteTable

  AppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref AppRouteTable

  DbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetA
      RouteTableId: !Ref DbRouteTable

  DbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetB
      RouteTableId: !Ref DbRouteTable

  # Security groups
  # Each tier can only accept traffic from the tier ahead of it
  # Internet, load balancer, application, database

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer - HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          # Open to whole internet
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb-sg"

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application tier - HTTP from the load balancer only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-sg"

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database tier - PostgreSQL from the application tier only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          # Only traffic from the application's security group
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  # Database tier

  # RDS requires subnets in at least two AZs
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets
      SubnetIds:
        - !Ref DbSubnetA
        - !Ref DbSubnetB

  Database:
    # Delete database and leave no backup after teardown to avoid billing
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      # In GB
      AllocatedStorage: "20"
      StorageType: gp3
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      # RDS generates the password and stores it in Secrets Manager
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      # No public IP address
      PubliclyAccessible: false
      StorageEncrypted: true
      MultiAZ: false
      BackupRetentionPeriod: 1
      # lets the stack be deleted without extra steps.  Not best practice, for assignment only.
      DeletionProtection: false

  # Application tier

  # Role the application uses to read the database password from Secrets Manager
  # Without this role, instances have no credentials to call AWS services.
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      # Trust policy: restricts WHO can assume this role.
      # Only EC2 instances can assume it
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Permissions policy: what the role CAN DO once assumed.
                # Grants the minimum needed — read one secret (the DB password).
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  # Attaches role to EC2 instance
  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppRole

  # Launch settings for each application instance
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AppAmiId
        InstanceType: !Ref AppInstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        # Script that runs on first boot
        # installs libraries, writes the web app and starts it as a service
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            dnf install -y python3-pip
            pip3 install boto3 psycopg2-binary
            mkdir -p /opt/app
            cat > /opt/app/app.py <<'EOF'
            import json
            import boto3
            import psycopg2
            from http.server import BaseHTTPRequestHandler, HTTPServer

            def query_database():
                client = boto3.client("secretsmanager", region_name="${AWS::Region}")
                secret = json.loads(client.get_secret_value(SecretId="${Database.MasterUserSecret.SecretArn}")["SecretString"])
                connection = psycopg2.connect(
                    host="${Database.Endpoint.Address}",
                    dbname="${DbName}",
                    user=secret["username"],
                    password=secret["password"],
                    connect_timeout=5,
                )
                cursor = connection.cursor()
                cursor.execute("SELECT version()")
                version = cursor.fetchone()[0]
                connection.close()
                return version

            class Handler(BaseHTTPRequestHandler):
                def do_GET(self):
                    if self.path == "/health":
                        body = "ok"
                    else:
                        try:
                            body = "Database connection successful: " + query_database()
                        except Exception as error:
                            body = "Database connection failed: " + str(error)
                    page = "<html><body><h1>L00205287 Sean Doyle</h1><p>" + body + "</p></body></html>"
                    self.send_response(200)
                    self.send_header("Content-Type", "text/html")
                    self.end_headers()
                    self.wfile.write(page.encode())

            HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
            EOF
            cat > /etc/systemd/system/app.service <<'EOF'
            [Unit]
            Description=Application tier web app
            After=network-online.target

            [Service]
            ExecStart=/usr/bin/python3 /opt/app/app.py
            DynamicUser=yes
            AmbientCapabilities=CAP_NET_BIND_SERVICE
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now app.service

  # Creates and manages the apps EC2 instances based on launch template
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - AppDefaultRoute
      - Listener
    Properties:
      VPCZoneIdentifier:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      # Use the newest version of the apps launch template
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      # 1 instance normally, max of 2
      MinSize: "1"
      MaxSize: "2"
      DesiredCapacity: "1"
      # # Registers instances with the load balancer
      TargetGroupARNs:
        - !Ref TargetGroup
      # Replace an instance if the load balancer says it's unhealthy
      HealthCheckType: ELB
      # Wait before health checks start after launch
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app"
          PropagateAtLaunch: true

  # Web tier

  # Receives traffic from the internet and passes it to the app tier
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # Wait for VPC to connect to the internet
    DependsOn: InternetGatewayAttachment
    Properties:
      # 'application' = HTTP-aware load balancer
      Type: application
      # Reachable from the internet
      Scheme: internet-facing
      IpAddressType: ipv4
      # One subnet per availability zone is required
      # Load balancer needs a min of 2 subnets, 1 per availability zone
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb"

  # Target group is the set of instances the application load balancer forwards to
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    # Target group belongs to this VPC
    Properties:
      VpcId: !Ref Vpc
      # Targets are whole EC2 instances
      TargetType: instance
      Protocol: HTTP
      Port: 80
      HealthCheckProtocol: HTTP
      # Health check returns from the app instances without touching databases
      # so database problems don't trigger healthy instance replacement
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      # Consecutive failures and passes to be healthy
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-tg"

  # Listens on port 80 and forwards requests to target group
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

# Outputs
# CloudFormation stores these values after deployment.
# Read them with aws cloudformation describe-stacks --stack-name <name> --query "Stacks[0].Outputs" to reduce
# the amount of manual ID look-ups after each redeploy
Outputs:
  VpcId:
    Description: ID of the VPC
    Value: !Ref Vpc

  LoadBalancerSecurityGroupId:
    Description: Security group for the web tier
    Value: !Ref LoadBalancerSecurityGroup

  AppSecurityGroupId:
    Description: Security group for the application tier
    Value: !Ref AppSecurityGroup

  DbSecurityGroupId:
    Description: Security group for the database tier
    Value: !Ref DbSecurityGroup

  DbEndpoint:
    Description: Hostname the application tier connects to
    Value: !GetAtt Database.Endpoint.Address

  # Only the ARN (Amazon Resource Name) of the secret it output, never the secret
  DbSecretArn:
    Description: ARN (Amazon Resource Name) of the Secrets Manager secret holding the database password
    Value: !GetAtt Database.MasterUserSecret.SecretArn

  LoadBalancerDnsName:
    Description: Public DNS (Domain Name System) name of the load balancer
    Value: !GetAtt LoadBalancer.DNSName

  SiteUrl:
    Description: Public HTTP address of the application
    Value: !Sub "http://${LoadBalancer.DNSName}/"