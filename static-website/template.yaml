# static-website/template.yaml

AWSTemplateFormatVersion: "2010-09-09"
Description: Static website - private S3 bucket served through CloudFront with Origin Access Control

Resources:
# Private S3 bucket that stores the website files.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Bucket is intentionally private
      PublicAccessBlockConfiguration:
        # rejects requests that try to set a public access control list
        BlockPublicAcls: true
        # Ignore public access control lists that already exist
        IgnorePublicAcls: true
        # Rejects bucket policies that grant public access
        BlockPublicPolicy: true
        # If there is a public policy, access is restricted to AWS services and authorized users
        RestrictPublicBuckets: true
    # Keeps previous version of overwritten or deleted objects for recovery purposes
      VersioningConfiguration:
        Status: Enabled

  # Origin Access Control (OAC)
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Lets CloudFront read the private site bucket
        OriginAccessControlOriginType: s3
        # always: sign every request to the origin.
        SigningBehavior: always
        # Signature Version 4 - AWS S3 request-signing method to verify the sender.
        SigningProtocol: sigv4

  # CloudFront distribution - The public-facing web service where visitors connect to index.html from the private bucket
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        # Returns index.html when a visitor requests the root path "/".
        DefaultRootObject: index.html
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          # Security: HTTP requests are redirected to HTTPS to encrypt traffic.
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # Bucket Policy allowing CloudFront to read from private S3 bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      # The bucket this policy is attached to.
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            # Who is allowed access: CloudFront
            Principal:
              Service: cloudfront.amazonaws.com
            # What is allowed: Reading objects only
            Action: s3:GetObject
            # Where: Every object in the bucket
            Resource: !Sub "${SiteBucket.Arn}/*"
            # Only when the request comes from this distribution, so no other
            # CloudFront distribution can read the bucket.
            Condition: # Applies if true
              StringEquals: # Compares the value
                # The single Amazon Resource Name allowed access the bucket
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  BucketName:
    Description: S3 bucket that holds the site content (used for uploading index.html)
    Value: !Ref SiteBucket # For an S3 bucket, Ref returns the bucket name

  DistributionId:
    Description: CloudFront distribution ID (used for CLI commands such as get-distribution)
    Value: !Ref SiteDistribution # For a distribution, Ref returns the distribution ID

  SiteUrl:
    Description: Public HTTPS address of the website
    Value: !Sub "https://${SiteDistribution.DomainName}/"